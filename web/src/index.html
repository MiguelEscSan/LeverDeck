<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LeverDeck</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2b2b2b" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f2" />
    <script>
      // Applies the theme this device pinned before the first paint, so it never flashes the other one.
      // Same key, attribute and colours as core/theme (THEME_KEY, DocumentThemeTarget, THEME_COLORS).
      (function () {
        try {
          var theme = localStorage.getItem('leverdeck.theme');
          if (theme !== 'dark' && theme !== 'light') return;
          document.documentElement.setAttribute('data-theme', theme);
          var color = theme === 'dark' ? '#2b2b2b' : '#f2f2f2';
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', color);
        } catch (e) {
          // Blocked storage: follow the system.
        }
      })();
    </script>
    <meta name="description" content="LeverDeck turns this device into a control surface for your PC." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LeverDeck" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" sizes="96x96" href="icons/icon-96x96.png" />
    <link rel="apple-touch-icon" href="icons/icon-180x180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>LeverDeck needs JavaScript to run.</noscript>
  </body>
</html>
