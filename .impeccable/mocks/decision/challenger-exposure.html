<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Exposure Record</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#0c0c0e;color:#e8e6df;font-family:"Archivo",Helvetica,Arial,sans-serif;padding:48px 56px;position:relative}
.ramp{position:absolute;left:0;right:0;top:0;height:100%;background:linear-gradient(90deg,#0c0c0e,#1a1a1e 30%,#2a2a2e 60%,#3a3a40);opacity:.4}
.sheet{position:relative;background:#e8e6df;color:#0c0c0e;border-radius:6px;padding:36px;transform:rotate(-.6deg);height:760px}
.legend{font-size:14px;letter-spacing:.2em;text-transform:uppercase}
h1{font-size:72px;letter-spacing:-.02em;margin-top:14px;font-weight:800}
.cells{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:34px}
.cell{height:150px;border:1px solid #0c0c0e;padding:14px;display:flex;flex-direction:column;justify-content:space-between}
.cell b{font-size:20px}
.cell small{font-size:13px;font-family:"Courier New",monospace}
.cell.hatch{background:repeating-linear-gradient(45deg,#0c0c0e 0 1px,transparent 1px 9px)}
.cell.sel{outline:3px solid #d34ea5;outline-offset:-3px}
.foot{position:absolute;left:56px;bottom:40px;font-size:14px;letter-spacing:.14em;color:#9a9a96;text-transform:uppercase}
</style></head>
<body>
<div class="ramp"></div>
<div class="sheet">
  <h1>Streaming</h1>
  <div class="cells">
    <div class="cell"><b>Mute mic</b><small>CTRL+SHIFT+M · +1</small></div>
    <div class="cell hatch"><b>Live</b><small>OBS · HELD</small></div>
    <div class="cell sel"><b>Camera</b><small>CTRL+SHIFT+C</small></div>
    <div class="cell"><b>Clip 30 s</b><small>ALT+F10</small></div>
    <div class="cell"><b>Starting soon</b><small>OBS · SCENE</small></div>
    <div class="cell"><b>Deafen</b><small>CTRL+SHIFT+D</small></div>
    <div class="cell"><b>Play / pause</b><small>MEDIA</small></div>
    <div class="cell"><b>Open OBS</b><small>LAUNCH</small></div>
  </div>
</div>
<div class="foot">Connected · MIGUEL-PC · 9 ms</div>
</body></html>
