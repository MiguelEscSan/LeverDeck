<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Split-Flap Departures</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#0d0d0d;color:#f2f2f2;font-family:"Archivo",Helvetica,Arial,sans-serif;padding:48px 56px}
.head{display:flex;align-items:baseline;gap:24px;border-bottom:1px solid #2a2a2a;padding-bottom:20px}
.word{font-weight:800;font-size:24px;letter-spacing:.06em;text-transform:uppercase}
.prof{margin-left:auto;display:flex;gap:10px}
.prof span{padding:12px 18px;border-radius:4px;background:#1b1b1b;font-size:15px;color:#b5b5b5}
.prof span.on{background:#ffb000;color:#0d0d0d;font-weight:700}
.board{margin-top:36px;display:grid;grid-template-columns:1fr 1fr;gap:14px 28px}
.row{display:grid;grid-template-columns:90px 1fr 210px 150px;align-items:center;height:96px;background:#161616;border-radius:4px;padding:16px 32px;gap:20px}
.row .n{font-family:"Courier New",monospace;color:#ffb000;font-size:26px;font-weight:700}
.row .t{font-size:32px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;overflow:hidden;white-space:nowrap}
.row .k{font-size:15px;color:#9a9a9a;letter-spacing:.06em}
.row .s{font-size:15px;text-align:right;color:#f2f2f2}
.row.live{background:#ffb000;color:#0d0d0d}
.row.live .n,.row.live .k,.row.live .s{color:#0d0d0d}
.row.dim{opacity:.5}
.foot{position:absolute;left:56px;bottom:40px;font-size:15px;color:#9a9a9a;letter-spacing:.06em}
</style></head>
<body>
<div class="head"><div class="word">LeverDeck</div><div class="prof"><span class="on">Streaming</span><span>Editing</span><span>Media</span><span>Games</span></div></div>
<div class="board">
  <div class="row live"><span class="n">01</span><span class="t">Live</span><span class="k">OBS · SCENE</span><span class="s">ON AIR</span></div>
  <div class="row"><span class="n">02</span><span class="t">Starting soon</span><span class="k">OBS · SCENE</span><span class="s">READY</span></div>
  <div class="row"><span class="n">03</span><span class="t">Mute mic</span><span class="k">CTRL+SHIFT+M</span><span class="s">OFF</span></div>
  <div class="row"><span class="n">04</span><span class="t">Camera</span><span class="k">CTRL+SHIFT+C</span><span class="s">ON</span></div>
  <div class="row"><span class="n">05</span><span class="t">Clip 30 s</span><span class="k">ALT+F10</span><span class="s">SAVE</span></div>
  <div class="row dim"><span class="n">06</span><span class="t">Deafen</span><span class="k">CTRL+SHIFT+D</span><span class="s">OFFLINE</span></div>
</div>
<div class="foot">CONNECTED OVER WI-FI · 9 MS</div>
</body></html>
