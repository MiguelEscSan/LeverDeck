<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Teletext Service</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#0000c0;color:#ffffff;font-family:"Courier New",monospace;padding:40px 56px;font-size:24px;line-height:1.5}
.bar{background:#00c000;color:#0000c0;padding:6px 14px;display:flex;justify-content:space-between;font-weight:700}
.title{color:#ffff00;margin-top:28px;font-weight:700}
.row{display:flex;gap:28px;margin-top:6px}
.row .p{color:#00ffff;width:90px}
.row .n{color:#ffffff;width:460px}
.row .k{color:#ffff00;width:280px}
.row.sel .n{background:#ffff00;color:#0000c0}
.foot{position:absolute;left:56px;bottom:40px;background:#00c000;color:#0000c0;padding:6px 14px;font-weight:700}
</style></head>
<body>
<div class="bar"><span>LEVERDECK</span><span>P100 PROFILES</span><span>MIGUEL-PC 9MS</span></div>
<div class="title">PROFILES</div>
<div class="row"><span class="p">101</span><span class="n">Streaming</span><span class="k">4 PAGES</span></div>
<div class="row sel"><span class="p">102</span><span class="n">Editing</span><span class="k">8 KEYS</span></div>
<div class="row"><span class="p">103</span><span class="n">Media</span><span class="k">7 KEYS</span></div>
<div class="row"><span class="p">104</span><span class="n">Games</span><span class="k">5 KEYS</span></div>
<div class="row"><span class="p">105</span><span class="n">Settings</span><span class="k">PAIRED DEVICES</span></div>
<div class="foot">101 STREAMING   102 EDITING   103 MEDIA   104 GAMES</div>
</body></html>
