name: Release

# A version tag (v0.1.0, or v0.2.0-beta.1 for a pre-release) builds, tests and publishes leverdeck.exe, then attaches
# it to a GitHub Release named after the tag; the exe's file version comes from the tag. The build job, which runs
# third-party package code, only reads the repository; the release job alone may write, and runs no package code.
# Re-running the workflow for a tag replaces the exe on its existing release instead of failing.
# Actions are pinned to commit SHAs (version in the trailing comment).
on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}
  ARTIFACT: leverdeck-win-x64

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: agent
    env:
      PUBLISH_DIR: ${{ github.workspace }}/artifacts/leverdeck
    steps:
      - name: Check the tag is a version
        working-directory: .
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            Write-Error "Tag '$env:TAG' is not a version such as v1.2.3 or v1.2.3-beta.1."
            exit 1
          }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: agent/global.json

      - name: Build web app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Restore
        run: dotnet restore LeverDeck.slnx

      - name: Build
        run: dotnet build LeverDeck.slnx --no-restore -c Release -p:RequireWebUi=true

      - name: Test
        run: dotnet test LeverDeck.slnx --no-build -c Release

      - name: Publish (Native AOT)
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          dotnet publish src/LeverDeck.App -c Release -r win-x64 -o $env:PUBLISH_DIR -p:RequireWebUi=true -p:Version=$version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.PUBLISH_DIR }}/leverdeck.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      DOWNLOAD_DIR: ${{ github.workspace }}/release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.DOWNLOAD_DIR }}

      - name: Create or update the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          $exe = Join-Path $env:DOWNLOAD_DIR 'leverdeck.exe'
          gh release view $env:TAG --repo $env:REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $exe --repo $env:REPO --clobber
          } else {
            $flags = @('--title', "LeverDeck $env:TAG", '--generate-notes')
            if ($env:TAG.Contains('-')) { $flags += '--prerelease' }
            gh release create $env:TAG $exe --repo $env:REPO @flags
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
