<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeverDeck Login Mock</title>
<style>
  :root {
    --bg: #2b2b2b;
    --panel: #3a3a3a;
    --field: #232323;
    --border: #151515;
    --text: #ffffff;
    --muted: #a0a0a0;
    --red: #e8315a;
    --blue: #1f4fe0;
    --orange: #f26b3a;
    --purple: #8a5cd6;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #141414;
    font-family: "Segoe UI", Inter, system-ui, sans-serif;
    color: var(--text);
  }
  .phone {
    width: 390px;
    height: 844px;
    background: var(--bg);
    border-radius: 44px;
    border: 10px solid #0b0b0b;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
    padding: 56px 28px 32px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  .notch {
    position: absolute; top: 12px; left: 50%; translate: -50% 0;
    width: 110px; height: 30px; background: #0b0b0b; border-radius: 20px;
  }
  header { display: flex; justify-content: space-between; align-items: flex-start; }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -.3px; }
  .sub { color: var(--muted); font-size: 15px; margin-top: 4px; display: flex; gap: 6px; align-items: center; }
  .icon-btn { width: 28px; height: 28px; color: var(--muted); }

  .hero { display: grid; place-items: center; margin: 44px 0 36px; }
  .logo {
    display: grid; grid-template-columns: repeat(2, 64px); gap: 10px;
    padding: 14px; background: #1e1e1e; border-radius: 30px; border: 3px solid var(--border);
  }
  .key {
    width: 64px; height: 64px; border-radius: 14px; border: 3px solid var(--border);
    display: grid; place-items: center;
    box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .18);
  }
  .key svg { width: 36px; height: 36px; filter: drop-shadow(0 2px 0 rgba(0,0,0,.55)); }

  label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 8px 4px; }
  .field {
    height: 54px; background: var(--field); border: 2px solid #444; border-radius: 16px;
    display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 16px;
  }
  .field .ph { color: #8a8a8a; }
  .field svg { width: 20px; height: 20px; color: var(--muted); }
  .status { margin-left: auto; width: 10px; height: 10px; border-radius: 50%; background: #3ccf7a; box-shadow: 0 0 0 4px rgba(60,207,122,.18); }

  .code { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 22px; }
  .digit {
    height: 58px; background: var(--field); border: 2px solid #444; border-radius: 14px;
    display: grid; place-items: center; font-size: 24px; font-weight: 700;
  }
  .digit.active { border-color: var(--blue); }
  .digit.active::after { content: ""; width: 2px; height: 26px; background: var(--text); }

  .actions { margin-top: auto; display: grid; gap: 12px; }
  .btn {
    height: 58px; border-radius: 18px; font-family: inherit; font-size: 17px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 10px; border: 3px solid var(--border);
    color: var(--text);
  }
  .primary { background: var(--blue); box-shadow: inset 0 -4px 0 rgba(0,0,0,.2); }
  .secondary { background: transparent; border: 2px solid #5a5a5a; font-weight: 600; }
  .btn svg { width: 22px; height: 22px; }
  .help { text-align: center; color: var(--muted); font-size: 13px; margin-top: 18px; line-height: 1.4; }
</style>
</head>
<body>
  <main class="phone">
    <div class="notch"></div>

    <header>
      <div>
        <h1>LeverDeck</h1>
        <p class="sub">Connect to your PC</p>
      </div>
      <svg class="icon-btn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
      </svg>
    </header>

    <section class="hero" aria-label="LeverDeck">
      <div class="logo">
        <div class="key" style="background: var(--red)">
          <svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <div class="key" style="background: var(--blue)">
          <svg viewBox="0 0 24 24" fill="#fff"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0" stroke="#fff" stroke-width="2" fill="none"/><rect x="11" y="17" width="2" height="4"/></svg>
        </div>
        <div class="key" style="background: var(--orange)">
          <svg viewBox="0 0 24 24" fill="#fff"><path d="M4 6h16v10H4z" fill="none" stroke="#fff" stroke-width="2.4"/><rect x="8" y="18" width="8" height="2.4"/></svg>
        </div>
        <div class="key" style="background: var(--purple)">
          <svg viewBox="0 0 24 24" fill="#fff"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
        </div>
      </div>
    </section>

    <label>PC address</label>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
      <span>leverdeck.local</span>
      <span class="status" title="PC found"></span>
    </div>

    <label style="margin-top: 22px">Pairing code</label>
    <div class="code" style="margin-top: 0">
      <div class="digit">4</div>
      <div class="digit">7</div>
      <div class="digit">2</div>
      <div class="digit active"></div>
      <div class="digit"></div>
      <div class="digit"></div>
    </div>

    <div class="actions">
      <button class="btn primary">Pair device</button>
      <button class="btn secondary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>
        Scan QR code
      </button>
      <p class="help">Open LeverDeck on your PC to see the QR code<br>and the pairing code.</p>
    </div>
  </main>
</body>
</html>
